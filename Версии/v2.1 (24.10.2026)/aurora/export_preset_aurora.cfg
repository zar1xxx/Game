; Резервная копия пресета экспорта для ОС Аврора.
; Обычный Godot (без порта Авроры) при сохранении удаляет неизвестные пресеты —
; тогда просто вставьте этот блок обратно в конец export_presets.cfg.

[preset.1]

name="Aurora OS"
platform="AuroraOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="android/*, build/*, *.keystore, aurora/*, tools/*"
export_path="build/aurora/ru.vladimkorol.vpogonezabenzinom.rpm"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

architecture/armv7hl=true
architecture/aarch64=true
architecture/x86_64=false
application/launcher_name="В погоне за бензином"
application/organization="ru.vladimkorol"
application/name="vpogonezabenzinom"
application/version="2.1"
application/release_version=1
icons/86x86="res://icons/86.png"
icons/108x108="res://icons/108.png"
icons/128x128="res://icons/128.png"
icons/172x172="res://icons/172.png"
sign/key=""
sign/cert=""
sign/password=""
permissions/Audio=true
rpm_validator/enable=false
